<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão Profissional em Realidade Aumentada</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- A-Frame e MindAR para Image Tracking -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- HUD da Interface -->
  <header id="hud">
    <h1>Cartão Profissional RA</h1>
    <p id="status-text">Aponte a câmera para o cartão</p>
  </header>

  <!-- Cena A-Frame / MindAR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets/targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Alvo 0 (Targets.mind) -->
    <a-entity id="example-target" mindar-image-target="targetIndex: 0">
      
      <!-- Bloco 1: Nome e Área (Painel Principal) -->
      <a-plane position="0 0.2 0.05" width="1.2" height="0.35" color="#1E293B" opacity="0.9" radius="0.02">
        <a-text value="Seu Nome Aqui" align="center" position="0 0.08 0.01" width="2.5" color="#38BDF8"></a-text>
        <a-text value="Desenvolvedor / Analista de Sistemas" align="center" position="0 -0.05 0.01" width="1.8" color="#FFFFFF"></a-text>
      </a-plane>

      <!-- Bloco 2: Sobre Mim & Competências -->
      <a-plane position="-0.4 -0.2 0.05" width="0.75" height="0.45" color="#0F172A" opacity="0.9">
        <a-text value="SOBRE & HABILIDADES" align="center" position="0 0.15 0.01" width="1.3" color="#38BDF8"></a-text>
        <a-text value="- Desenvolvimento Web & Software\n- Banco de Dados & SQL\n- Visao Computacional & IA\n- Git & Docker" align="left" position="-0.32 -0.02 0.01" width="1.1" color="#E2E8F0"></a-text>
      </a-plane>

      <!-- Bloco 3: Projetos e Contato -->
      <a-plane position="0.4 -0.2 0.05" width="0.75" height="0.45" color="#0F172A" opacity="0.9">
        <a-text value="PROJETOS & CONTATO" align="center" position="0 0.15 0.01" width="1.3" color="#38BDF8"></a-text>
        <a-text value="- Projeto RA / Visao Computacional\n- Sistemas Web & Automacao\n\nGitHub: github.com/seu-usuario\nEmail: contato@email.com" align="left" position="-0.32 -0.02 0.01" width="1.1" color="#E2E8F0"></a-text>
      </a-plane>

      <!-- Elemento Decorativo 3D (Cubo Flutuante) -->
      <a-box position="0 0.45 0.1" rotation="0 45 45" scale="0.12 0.12 0.12" color="#38BDF8"
             animation="property: rotation; to: 360 405 45; loop: true; dur: 6000; easing: linear">
      </a-box>

    </a-entity>
  </a-scene>

  <script src="js/app.js"></script>
</body>
</html>
